name: Recover verified 0.9 candidate
on:
  push:
    branches: [codex/090-completion-20260925]
    paths: [.github/workflows/090-recover.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recover-090-source
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify complete candidate before applying any source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, json, base64, urllib.request, zlib, hashlib, pathlib, bz2, subprocess
          baseline = '719e0152858dd199c666fe9917cedcea1b11bbbf'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          prior = subprocess.check_output(['git','diff','--name-only',baseline,'HEAD']).decode().splitlines()
          assert all(name.startswith('.github/') for name in prior), 'Source changed since recovery baseline; reconcile first.'
          ids = ['90c31be46d333248cdc2006d4c7b37f8ea82ff94','f20457dde27e3707b2208a95ecd7a22a581c86aa','d8ba6a5b43214b20493ca46e26dc2ccb5e5b0155','8ca206fb0a108ace8d70703d42e2338ddeb66079','6708427f0f169d686305fdd22d6dd32bba70458d','e7729eaab9eccc55d57a3407878e0004f821b4d3','06cd475112871624e60f476d632d345e765b95e2','b8eb16f78d611fb96905b6e86d840431eeff03bf','a4040a6c3155e9cb4f3a4c9d6ef688784861a753','70d47f5c62a9bf4f4e2a5933214b28b875359dbf','474dfc4132c0496f8d1259661673aa07ca287562','c6c6feaa547d2a33cf8e1c80826f77cf3fb54702','50e20dc433989a42a0031b81f1ea5e5f12cf6835','f007044a8ac706c3a9f2545c4cf1df27d125547e','067a13b3b6f4fc0304feffaa523f1678180d7e29','b61fd6306d1abd0b469a70d33dff141de8f2d9aa','09adea3ff00aa70db315d8cf0750d34bdc99b85d','da2f38df31fb6f6e0c3f6282a0e2f1ac1fe3c177']
          rows={}; rejected=[]
          for sha in ids:
            req=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            obj=json.load(urllib.request.urlopen(req,timeout=30)); data=base64.b64decode(obj['content'])
            assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
            for line in data.decode().splitlines():
              num,crc,text=line.split(':',2); idx=int(num)
              assert 0 <= idx < 1656
              if f'{zlib.crc32(text.encode()):08x}'!=crc:
                rejected.append(idx); continue
              assert idx not in rows or rows[idx]==text, 'Conflicting valid transfer records'
              rows[idx]=text
          missing=[i for i in range(1656) if i not in rows]
          print('TRANSFER',json.dumps({'verifiedRows':len(rows),'missingRows':missing,'rejectedRows':rejected}),flush=True)
          assert not missing, 'Incomplete transport; no source will be applied'
          compressed=base64.b64decode(''.join(rows[i] for i in range(1656)),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='e102212c7d4033f3d49433484847f17a99c43c7d8a05b43f8e3ec37a4c1faa38'
          patch=bz2.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest()=='6d94e51877bb721f557a2db7d4b71462d1e5af5b36831bc1bfffc5d296e154d4'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'verified-source.patch'; target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==78, f'Unexpected source file count: {len(paths)}'
          assert not any(p.startswith(('.github/','.git/','node_modules/','runtime/','dist/')) for p in paths)
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          pathlib.Path(os.environ['RUNNER_TEMP'],'source-verification.json').write_text(json.dumps({'baseline':baseline,'patchSHA256':hashlib.sha256(patch).hexdigest(),'files':hashes},indent=2,ensure_ascii=False))
          print('VERIFIED_SOURCE',len(paths),hashlib.sha256(patch).hexdigest(),flush=True)
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:all
      - name: Commit verified source only to the existing development branch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: codex/090-completion-20260925
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          test "$(git diff --cached --name-only | wc -l)" -eq 78
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(0.9): restore verified modular creation and Quest candidate'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "VERIFIED_COMMIT=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-verification
          path: ${{ runner.temp }}/source-verification.json
          retention-days: 3
