name: Prepare 0.9 development workbench
on:
  push:
    branches: [codex/090-development]
    paths: [.github/workflows/090-workbench.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Package tracked source and isolated dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Designform_Dev/toolchain"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/Designform_Dev"
          cp -a node_modules "$RUNNER_TEMP/Designform_Dev/node_modules"
          cp "$(which node)" "$RUNNER_TEMP/Designform_Dev/toolchain/node"
          git rev-parse HEAD > "$RUNNER_TEMP/Designform_Dev/SOURCE_SHA.txt"
          tar -czf "$RUNNER_TEMP/designform-workbench.tar.gz" -C "$RUNNER_TEMP" Designform_Dev
      - uses: actions/upload-artifact@v4
        with:
          name: designform-workbench
          path: ${{ runner.temp }}/designform-workbench.tar.gz
          retention-days: 1
          compression-level: 0
