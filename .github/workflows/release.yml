name: Release Windows edition
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Publish web edition']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.8.0
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name || github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  tag-version:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create version tag when missing
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; no release tag needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$HEAD_SHA" -m "策问 Designform $TAG"
          git push origin "$TAG"

  windows:
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw '标签与 package.json 版本不一致' }
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish portable package and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $packages = @(Get-ChildItem release/Designform-*-Windows-x64.zip)
          if ($packages.Count -ne 1) { throw '发行包数量异常' }
          $package = $packages[0]
          $digest = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($package.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          gh release view $env:RELEASE_TAG --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "策问 Designform $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
          }
          gh release upload $env:RELEASE_TAG $package.FullName release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传发行包失败' }
