name: Release Windows edition
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Publish web edition']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag (for example v0.9.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
# 串行发布，避免不同事件对同名附件并发写入。已发布资产不可被覆盖。
concurrency:
  group: designform-release
  cancel-in-progress: false
jobs:
  resolve:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve immutable release source
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid version'; exit 1; }
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!==l.version||p.version!==l.packages[''].version)process.exit(1)" || { echo 'Package and lockfile versions differ'; exit 1; }
          TAG="v$VERSION"
          SHA=$(git rev-parse HEAD)
          git fetch origin main --tags
          git merge-base --is-ancestor "$SHA" origin/main || { echo 'Release source is not on main'; exit 1; }
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            # 用户批准的候选通过精确版本意图发布为 prerelease，不会变成稳定最新版。
            if [[ "$EVENT_NAME" == workflow_run ]]; then
              node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('.github/release-intent.json','utf8'));if(p.version!==require('./package.json').version||p.channel!=='prerelease')process.exit(1)" || { echo 'No matching explicit prerelease intent'; exit 0; }
            fi
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" != workflow_run && "$REQUESTED_TAG" != "$TAG" ]]; then
            echo 'Tag and package version differ'; exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [[ "$TAG_SHA" != "$SHA" ]]; then
              if [[ "$EVENT_NAME" == workflow_run ]]; then
                echo 'This version was already tagged from another commit; skip, never overwrite.'; exit 0
              fi
              echo 'Release source differs from tag'; exit 1
            fi
          else
            [[ "$EVENT_NAME" == workflow_run ]] || { echo 'Explicit version tag is missing'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/cewen-release-state 2>/dev/null; then
            if [[ $(cat /tmp/cewen-release-state) == false ]]; then
              echo 'Published release exists; skip, never overwrite assets.'; exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
  windows:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag and checked out source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagSha = git rev-parse "$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:SOURCE_SHA -or "v$version" -ne $env:RELEASE_TAG) { throw '版本、标签与实际源码不一致' }
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Prepare checksums and provenance
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedName = "Designform-$version-Windows-x64.zip"
          $packages = @(Get-ChildItem release/Designform-*-Windows-x64.zip)
          if ($packages.Count -ne 1) { throw '发行包数量异常' }
          $package = $packages[0]
          if ($package.Name -ne $expectedName) { throw 'ZIP 文件名与版本不一致' }
          $digest = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($package.Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          @{repository=$env:GITHUB_REPOSITORY; tag=$env:RELEASE_TAG; commit=$env:SOURCE_SHA; version=$version; package=$package.Name; sha256=$digest} | ConvertTo-Json | Set-Content release/SOURCE.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.resolve.outputs.tag }}
          path: |
            release/Designform-*-Windows-x64.zip
            release/SHA256SUMS.txt
            release/SOURCE.json
          retention-days: 14
      - name: Publish without overwriting an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft -or $release.assets.Count -gt 0) { throw '已有发行或附件，停止覆盖。请核对失败运行的完整构建产物后人工处理。' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "策问 Designform $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw '创建草稿 Release 失败' }
          }
          $package = @(Get-ChildItem release/Designform-*-Windows-x64.zip)[0]
          gh release upload $env:RELEASE_TAG $package.FullName release/SHA256SUMS.txt release/SOURCE.json
          if ($LASTEXITCODE -ne 0) { throw '上传失败，保留草稿，不自动覆盖任何附件' }
          if ($env:PRERELEASE -eq 'true') {
            gh release edit $env:RELEASE_TAG --draft=false --prerelease --latest=false
          } else {
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw '发布状态更新失败' }
          $published = gh release view $env:RELEASE_TAG --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.tagName -ne $env:RELEASE_TAG) { throw '发布状态核对失败' }
          $names = @($published.assets | ForEach-Object { $_.name })
          foreach ($name in @($package.Name,'SHA256SUMS.txt','SOURCE.json')) {
            if ($name -notin $names) { throw "发行附件缺失：$name" }
          }
          if ($env:PRERELEASE -eq 'true' -and !$published.isPrerelease) { throw '候选未标记为 prerelease' }
